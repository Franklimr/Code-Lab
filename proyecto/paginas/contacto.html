<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Code Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <h1>Contacto Code Lab</h1>
        <i class="fa-regular fa-envelope"></i>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="estilo-contacto">
            <form action="/registro" method="post" autocomplete="on">
                <label>Nombre: <input type="text" name="nombre" required></label>
                <br>
                <label>Correo: <input type="email" name="correo" required></label>
                <br>
                <p>Seleccione un curso para mas informacion</p>
                <select name="opciones">
                    <option value="vacio">Sin seleccion</option>
                    <option value="FE">Curso Front-End</option>
                    <option value="BE">Curso Back-End</option>
                </select>
                <br>
                <button class="boton" type="submit" >Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2026 Code Lab</p>
        <p>Sitio realizado por Rivas Franklim para Talento Tech</p>
    </footer>
</body>
</html>
